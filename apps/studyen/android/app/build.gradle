plugins { id 'com.android.application' }
android {
    namespace 'com.jianjin.ielts'
    compileSdk 35
    buildToolsVersion '35.0.0'
    defaultConfig {
        applicationId 'com.jianjin.ielts'
        minSdk 26
        targetSdk 35
        versionCode 3
        versionName '0.2.1'
    }
    compileOptions { sourceCompatibility JavaVersion.VERSION_17; targetCompatibility JavaVersion.VERSION_17 }
    signingConfigs { debug { storeFile file('../../.toolchain/debug.keystore'); storePassword 'android'; keyAlias 'androiddebugkey'; keyPassword 'android' } }
}
tasks.register('syncWebAssets', Copy) {
    from '../../dist'
    exclude 'downloads/**'
    into 'src/main/assets'
}
tasks.named('preBuild').configure { dependsOn 'syncWebAssets' }
